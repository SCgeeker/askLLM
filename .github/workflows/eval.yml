# golden set live 評測(v1.4 項目 F)—— 手動觸發,需 repo secrets 提供金鑰。
# 產出 dev-notes/golden-*.md / .json 作為 artifact,不 commit 回 repo。
#
# secrets(擇一,依 provider):GEMINI_API_KEY、OPENROUTER_API_KEY、NVIDIA_API_KEY。
# 路徑分項:runner 上沒有 jamovi,掃不到模組 → 路徑分項自動跳過(報告會註明);
# 要含路徑命中率請在本機以 tools/run-golden.R 跑。
name: golden-eval

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'provider (gemini | openrouter | nim)'
        required: true
        default: 'gemini'
      model:
        description: 'model id (blank = provider default)'
        required: false
        default: ''
      analysis:
        description: 'askllm | askllmr | both'
        required: false
        default: 'both'

jobs:
  golden:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgload
          needs: check

      - name: Run golden set
        run: |
          Rscript -e '
            pkgload::load_all(".", quiet = TRUE)
            source("tools/run-golden.R")
            an <- "${{ github.event.inputs.analysis }}"
            an <- if (identical(an, "both") || !nzchar(an)) c("askllm", "askllmr") else an
            model <- "${{ github.event.inputs.model }}"
            if (!nzchar(model)) model <- NULL
            run_golden(provider = "${{ github.event.inputs.provider }}",
                       model = model, analysis = an, with_catalog = FALSE)
          '

      - uses: actions/upload-artifact@v4
        with:
          name: golden-report
          path: |
            dev-notes/golden-*.md
            dev-notes/golden-*.json
          if-no-files-found: error
